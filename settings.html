<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Data Settings | RedZone Sports</title><link rel="stylesheet" href="css/style.css"></head><body><header id="site-header"></header><main class="container page-main"><div class="page-title"><span class="eyebrow">CONFIGURATION</span><h1>DATA <em>SETTINGS</em></h1><p>Choose manual JSON data or enable the automatic ESPN public scoreboard feed.</p></div><section class="settings-card"><label class="toggle-row"><span><b>Automatic ESPN data</b><small>Fetches available scoreboard and news data from ESPN's public site endpoints. Availability and CORS access can vary.</small></span><input id="auto-toggle" type="checkbox"></label><div class="form-row"><label for="api-sport">Default sport feed</label><select id="api-sport"></select></div><div class="settings-actions"><button id="save-settings" class="btn btn-red">Save settings</button><button id="clear-settings" class="btn btn-outline">Reset settings</button></div><p id="settings-message" class="status-line"></p></section><section class="section"><div class="section-heading"><div><span class="eyebrow">HOW TO EDIT CONTENT</span><h2>MANUAL JSON DATA</h2></div></div><p class="muted">Edit <code>data/matches.json</code> for fixtures and <code>data/news.json</code> for articles. Commit the changes to GitHub; GitHub Pages will publish them.</p></section></main><footer id="site-footer"></footer><script src="js/app.js"></script><script src="js/settings.js"></script></body></html>
